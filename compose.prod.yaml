services:
  # --- The Webserver (FrankenPHP) ---
  app:
    build: .
    restart: unless-stopped
    ports:
      - "80:80"  # HTTP
      - "443:443"  # HTTPS (For auto SSL)
      - "443:443/udp" # HTTP/3 support
    environment:
      # This tells FrankenPHP which domain to request an SSL cert for
      SERVER_NAME: treescope.cs.hs-fulda.de
    env_file: .env
    depends_on:
      - db
      - redis
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      # Mount public storage so uploads persist across container restarts
      - ./storage/app/public:/treescope-ng/storage/app/public

  # --- The Queue Worker ---
  worker:
    build: .
    restart: unless-stopped
    command: php artisan queue:work --tries=3
    env_file: .env
    depends_on:
      - db
      - redis
    volumes:
      - ./storage/app/public:/treescope-ng/storage/app/public

  # --- The Scheduler ---
  scheduler:
    build: .
    restart: unless-stopped
    command: php artisan schedule:work
    env_file: .env
    depends_on:
      - db
      - redis

  # --- PostGIS Database ---
  db:
    image: postgis/postgis
    container_name: db
    restart: unless-stopped
    environment:
      # Explicit mapping required by the Postgres image
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data

  # --- Redis (Cache, Sessions, Queues) ---
  redis:
    image: redis:alpine
    container_name: redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

  # --- Mailpit ---
  mailpit:
    image: axllent/mailpit
    container_name: mailpit
    restart: unless-stopped
    volumes:
      - ./.mailpit:/data
    ports:
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  pg_data: {}
  redis_data: {}
  caddy_data: {}
  caddy_config: {}
