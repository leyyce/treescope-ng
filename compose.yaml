services:
  # --- The Webserver (FrankenPHP) ---
  app:
    build:
      context: .
      target: prod
    restart: unless-stopped
    ports:
      - "80:80"        # HTTP
      - "443:443"      # HTTPS (For Let's Encrypt Auto-SSL)
      - "443:443/udp"  # HTTP/3 QUIC support
    environment:
      # Tells FrankenPHP which domain to request a Let's Encrypt SSL cert for
      SERVER_NAME: ${APP_HOST_NAME}
      # Force HTTPS URLs generated by Laravel
      OCTANE_HTTPS: "true"
    env_file: .env
    depends_on:
      - db
      - redis
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      # Mount public storage so user uploads persist across container restarts
      - ./storage/app/public:/app/storage/app/public

  # --- The Queue Worker ---
  worker:
    build:
      context: .
      target: prod
    restart: unless-stopped
    command: php artisan queue:work --tries=3
    env_file: .env
    depends_on:
      - db
      - redis
    volumes:
      - ./storage/app/public:/app/storage/app/public

  # --- The Scheduler ---
  scheduler:
    build:
      context: .
      target: prod
    restart: unless-stopped
    command: php artisan schedule:work
    env_file: .env
    depends_on:
      - db
      - redis

  # --- PostGIS Database (Isolated, no exposed ports) ---
  db:
    image: postgis/postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data

  # --- Redis (Isolated, no exposed ports) ---
  redis:
    image: redis:alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  # --- Mailpit (UI restricted to localhost via SSH Tunnel) ---
  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    volumes:
      - ./.mailpit:/data
    ports:
      - "8025:8025" # Web UI
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db

volumes:
  pg_data: {}
  redis_data: {}
  caddy_data: {}
  caddy_config: {}
