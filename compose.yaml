# ==========================================
# YAML Anchors (DRY Configuration)
# ==========================================
# We define the shared configuration for all Laravel-based services here
# so we don't have to repeat ourselves in the app, worker, and scheduler.
x-laravel-service: &laravel-service
  build:
    context: .
    target: prod
  restart: unless-stopped
  env_file: .env
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  # --- The Webserver (FrankenPHP) ---
  app:
    <<: *laravel-service
    ports:
      - "80:80"        # HTTP
      - "443:443"      # HTTPS (For Let's Encrypt Auto-SSL)
      - "443:443/udp"  # HTTP/3 QUIC support
    environment:
      # Tells FrankenPHP which domain to request a Let's Encrypt SSL cert for
      # CADDY_SERVER_SERVER_NAME: ${APP_HOST_NAME}
      # Force HTTPS URLs generated by Laravel
      # OCTANE_HTTPS: "true"
      # Give this container the authority to run migrations and to run the octane startup command
      CONTAINER_ROLE: app
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      # Mount public storage so user uploads persist across container restarts
      - ./storage/app/public:/app/storage/app/public

  # --- The Queue Worker ---
  worker:
    <<: *laravel-service
    command: php artisan queue:work --tries=3
    volumes:
      - ./storage/app/public:/app/storage/app/public

  # --- The Scheduler ---
  scheduler:
    <<: *laravel-service
    command: php artisan schedule:work

  # --- PostGIS Database (Isolated, no exposed ports) ---
  db:
    image: postgis/postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-treescope} -d ${DB_DATABASE:-treescope}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Redis (Isolated, no exposed ports) ---
  redis:
    image: redis:alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Mailpit (UI restricted to localhost via SSH Tunnel) ---
  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    volumes:
      - ./.mailpit:/data
    ports:
      - "8025:8025" # Web UI
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db

volumes:
  pg_data: {}
  redis_data: {}
  caddy_data: {}
  caddy_config: {}
