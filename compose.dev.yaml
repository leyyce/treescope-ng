services:
  # --- The Local Webserver (FrankenPHP)---
  app:
    build:
      context: .
      target: dev
    ports:
      - "80:80"        # HTTP
      - "443:443"      # HTTPS (For Let's Encrypt Auto-SSL)
      - "443:443/udp"  # HTTP/3 QUIC support
    environment:
      # Tells FrankenPHP which domain to request a Let's Encrypt SSL cert for
      SERVER_NAME: ${APP_HOST_NAME}
      # Force HTTPS URLs generated by Laravel
      OCTANE_HTTPS: "true"
    env_file: .env
    volumes:
      # Sync the entire local project directory into the container instantly
      - ./:/app
      - caddy_data_local:/data
      - caddy_config_local:/config
    depends_on:
      - db
      - redis

  # --- Vite Dev Server (For CSS/React Hot-Reloading) ---
  vite:
    build:
      context: .
      target: dev
    # Expose the Vite server to the host machine for live reloading
    command: npm run dev -- --host
    ports:
      - "5173:5173"
    volumes:
      - ./:/app

  # --- Local Queue Worker ---
  worker:
    build:
      context: .
      target: dev
    command: php artisan queue:work
    env_file: .env
    volumes:
      - ./:/app
    depends_on:
      - db
      - redis

  # --- Local Scheduler ---
  scheduler:
    build:
      context: .
      target: dev
    command: php artisan schedule:work
    env_file: .env
    volumes:
      - ./:/app
    depends_on:
      - db
      - redis

  # --- Local PostGIS Database ---
  db:
    image: postgis/postgis
    ports:
      # Expose DB port locally for DB tools
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg_data_local:/var/lib/postgresql/data

  # --- Local Redis ---
  redis:
    image: redis:alpine
    ports:
      # Expose Redis locally for debugging tools
      - "6379:6379"

  # --- Local Mailpit ---
  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025" # SMTP exposed for local dev testing
      - "8025:8025" # UI accessible at http://localhost:8025

volumes:
  pg_data_local: {}
  caddy_data_local: {}
  caddy_config_local: {}
