# ==========================================
# YAML Anchors (DRY Configuration)
# ==========================================
# We define the shared configuration for all Laravel-based services here
# so we don't have to repeat ourselves in the app, worker, and scheduler.
x-laravel-service: &laravel-service
  build:
    context: .
    target: dev
  env_file: .env
  volumes:
    # Sync the entire local project directory into the container instantly
    - ./:/app
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  # --- The Local Webserver (FrankenPHP)---
  app:
    <<: *laravel-service
    ports:
      - "80:80"        # HTTP
      - "443:443"      # HTTPS (For Let's Encrypt Auto-SSL)
      - "443:443/udp"  # HTTP/3 QUIC support
    environment:
      # Tells FrankenPHP which domain to request a Let's Encrypt SSL cert for
      # SERVER_NAME: ${APP_HOST_NAME}
      # Force HTTPS URLs generated by Laravel
      # OCTANE_HTTPS: "true"
      # Give this container the authority to run migrations and to run the octane startup command
      CONTAINER_ROLE: app
    volumes:
      # Sync the entire local project directory into the container instantly
      - ./:/app
      - caddy_data_local:/data
      - caddy_config_local:/config

  # --- Vite Dev Server (For CSS/React Hot-Reloading) ---
  vite:
    build:
      context: .
      target: dev
    # Expose the Vite server to the host machine for live reloading
    command: npm run dev -- --host
    ports:
      - "5173:5173"
    volumes:
      - ./:/app

  # --- Local Queue Worker ---
  worker:
    <<: *laravel-service
    command: php artisan queue:work
    healthcheck:
      test: [ "NONE" ]
      disable: true

  # --- Local Scheduler ---
  scheduler:
    <<: *laravel-service
    command: php artisan schedule:work
    healthcheck:
      test: [ "NONE" ]
      disable: true

  # --- Local PostGIS Database ---
  db:
    image: postgis/postgis
    ports:
      # Expose DB port locally for DB tools
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg_data_local:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-treescope} -d ${DB_DATABASE:-treescope}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Local Redis ---
  redis:
    image: redis:alpine
    ports:
      # Expose Redis locally for debugging tools
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Local Mailpit ---
  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025" # SMTP exposed for local dev testing
      - "8025:8025" # UI accessible at http://localhost:8025

volumes:
  pg_data_local: {}
  caddy_data_local: {}
  caddy_config_local: {}
